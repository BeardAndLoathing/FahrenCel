# Builds the FahrenCel APK on GitHub.
# - Every push to main: builds the APK and keeps it as a downloadable artifact on the run.
# - Publishing a release on GitHub (Releases > Draft a new release, tag like v0.2):
#   builds and attaches the APK to that release, so testers get a simple download link.
name: Build APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # The test signing key lives in repo secrets, not in the repo. Without the secrets
      # (e.g. on forks) the build falls back to the standard debug key.
      - name: Restore test signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FAHRENCEL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fahrencel-test.keystore"
            echo "FAHRENCEL_KEYSTORE_FILE=$RUNNER_TEMP/fahrencel-test.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          FAHRENCEL_KEYSTORE_PASSWORD: ${{ secrets.FAHRENCEL_KEYSTORE_PASSWORD }}
          FAHRENCEL_KEY_ALIAS: fahrencel
          FAHRENCEL_KEY_PASSWORD: ${{ secrets.FAHRENCEL_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PversionCode=${GITHUB_RUN_NUMBER} \
            -PversionName=${{ steps.ver.outputs.name }}
          cp app/build/outputs/apk/debug/app-debug.apk FahrenCel-${{ steps.ver.outputs.name }}.apk

      - name: Keep the APK on this run
        uses: actions/upload-artifact@v4
        with:
          name: FahrenCel-${{ steps.ver.outputs.name }}
          path: FahrenCel-*.apk

      - name: Attach the APK to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FahrenCel-*.apk
          generate_release_notes: true
